name: Scanner checks
on:
  pull_request:
    paths: ['scanner/**', 'supabase/**', 'tests/**', 'package*.json', '.github/workflows/scanner-checks.yml']
  push:
    branches: [main, feat/staff-scanner-auth]
    paths: ['scanner/**', 'supabase/**', 'tests/**', 'package*.json', '.github/workflows/scanner-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
